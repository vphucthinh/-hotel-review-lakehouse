# Reference job definition (Databricks Asset Bundle format).
# You can also build the same job in the UI (see the guide, step 10).
resources:
  jobs:
    hotel_review_pipeline:
      name: hotel-review-pipeline

      # run when a new file lands in the raw volume
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/hotel_lakehouse/raw/
          min_time_between_triggers_seconds: 900

      email_notifications:
        on_failure:
          - your_email@example.com

      # always run the latest code on the main branch
      git_source:
        git_url: https://github.com/<your-username>/hotel-review-lakehouse
        git_provider: gitHub
        git_branch: main

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: notebooks/01_bronze_ingest
            source: GIT

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: notebooks/02_silver_clean
            source: GIT

        - task_key: ai_sentiment
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: notebooks/03_ai_sentiment
            source: GIT

        - task_key: gold
          depends_on:
            - task_key: ai_sentiment
          notebook_task:
            notebook_path: notebooks/04_gold_star_schema
            source: GIT
